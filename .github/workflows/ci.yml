name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -x -q


  civitae-mcp-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './packages/civitae-mcp[dev]' build
      - name: Ruff
        working-directory: packages/civitae-mcp
        run: python -m ruff check .
      - name: Mypy
        working-directory: packages/civitae-mcp
        run: python -m mypy src/civitae_mcp
      - name: Package tests
        working-directory: packages/civitae-mcp
        run: python -m pytest tests -q
      - name: Build wheel and sdist
        run: python -m build packages/civitae-mcp
