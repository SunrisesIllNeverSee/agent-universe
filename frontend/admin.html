<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://signomy.xyz/admin" />
<title>Admin — CIVITAE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght;700&family=DM+Sans:wght;400;500;600&family=DM+Mono:wght;400;500&display=swap">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root {
  --bg:      #070809;
  --surface: #0D1014;
  --surface2:#111418;
  --border:  #1A1D22;
  --border2: #232830;
  --text:    #D8DBE3;
  --muted:   #5A6070;
  --gold:    #C4923A;
  --cmd:     #2A6FBF;
  --green:   #3DAA6A;
  --red:     #D84040;
  --warn:    #C45B3F;
  --amber:   #D48C2E;
  --mono:    'DM Mono', monospace;
  --sans:    'DM Sans', sans-serif;
  --display: 'Playfair Display', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

/* ── Topbar ───────────────────────────────────────────────────────── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
}
.topbar-title {
  font-family: var(--display); font-size: 16px; font-weight: 700;
  color: var(--gold); letter-spacing: 0.02em;
}
.topbar-title span { color: var(--muted); font-family: var(--sans); font-weight: 400; font-size: 12px; margin-left: 8px; }
.topbar-back a {
  font-size: 12px; color: var(--muted); text-decoration: none;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px;
  transition: color 0.15s, border-color 0.15s;
}
.topbar-back a:hover { color: var(--text); border-color: var(--border2); }

/* ── Admin key bar ────────────────────────────────────────────────── */
.admin-key-bar {
  position: fixed; top: 48px; left: 0; right: 0; z-index: 99;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.admin-key-bar span:first-child {
  font-family: var(--mono); font-size: 0.62rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.admin-key-input {
  flex: 1; max-width: 320px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 6px 10px; color: var(--text);
  font-family: var(--mono); font-size: 0.75rem;
}
.admin-key-input:focus { outline: none; border-color: var(--gold); }
.admin-key-btn {
  background: var(--surface); border: 1px solid var(--border2); border-radius: 4px;
  padding: 6px 14px; color: var(--text); cursor: pointer;
  font-family: var(--sans); font-size: 0.75rem;
}
.admin-key-btn:hover { border-color: var(--gold); }
.admin-key-status {
  font-family: var(--mono); font-size: 0.62rem; padding: 3px 8px; border-radius: 3px;
}
.admin-key-status.set { color: var(--green); background: rgba(61,170,106,0.1); }
.admin-key-status.unset { color: var(--muted); }

/* ── Content ──────────────────────────────────────────────────────── */
.content {
  margin-top: 100px;
  padding: 20px;
  max-width: 800px;
  margin-left: auto; margin-right: auto;
}

/* ── Login gate ───────────────────────────────────────────────────── */
.login-gate {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 60dvh; text-align: center;
}
.login-gate h2 {
  font-family: var(--display); font-size: 24px; color: var(--gold);
  margin-bottom: 12px;
}
.login-gate p {
  font-size: 14px; color: var(--muted); margin-bottom: 24px; max-width: 400px;
}
.login-gate .admin-key-bar {
  position: static; border: 1px solid var(--border); border-radius: 6px;
  padding: 16px 20px; background: var(--surface);
}

/* ── Section headers ──────────────────────────────────────────────── */
.section-header {
  font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em;
  margin: 24px 0 10px 0; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.section-header:first-child { margin-top: 0; }
.section-count {
  color: var(--gold); font-weight: 500;
}

/* ── Review cards ─────────────────────────────────────────────────── */
.review-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: border-color 0.15s;
}
.review-card:hover { border-color: var(--border2); }
.card-id {
  font-family: var(--mono); font-size: 0.6rem; color: var(--muted);
  margin-bottom: 4px;
}
.card-title {
  font-size: 0.85rem; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.review-badge {
  font-family: var(--mono); font-size: 0.55rem; color: var(--gold);
  background: rgba(196,146,58,0.1); border: 1px solid rgba(196,146,58,0.2);
  padding: 2px 6px; border-radius: 3px; text-transform: uppercase;
}
.review-from {
  font-family: var(--mono); font-size: 0.62rem; color: var(--muted);
  margin-top: 3px;
}
.review-body {
  font-size: 0.75rem; color: var(--text); margin-top: 6px; line-height: 1.5;
}
.review-actions {
  display: flex; gap: 8px; margin-top: 10px;
}
.review-btn {
  background: transparent; border: 1px solid var(--border2); border-radius: 4px;
  padding: 5px 14px; cursor: pointer;
  font-family: var(--sans); font-size: 0.72rem; font-weight: 500;
  transition: all 0.15s;
}
.review-btn:hover { color: var(--text); border-color: var(--border2); }
.review-btn.approve { color: var(--green); border-color: rgba(61,170,106,0.3); }
.review-btn.approve:hover { background: rgba(61,170,106,0.1); }
.review-btn.reject { color: var(--warn); border-color: rgba(196,91,63,0.3); }
.review-btn.reject:hover { background: rgba(196,91,63,0.1); }
.card-meta {
  font-family: var(--mono); font-size: 0.6rem; color: var(--muted);
  margin-top: 6px;
}

/* ── Empty state ──────────────────────────────────────────────────── */
.empty-state {
  text-align: center; color: var(--muted);
  font-size: 0.8rem; padding: 40px 20px;
}
</style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FD4VLSCHY8"></script>

    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-FD4VLSCHY8');
  </script>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-title">CIVITAE<span>Admin Review Queue</span></div>
  <div class="topbar-back"><a href="/console">&larr; Back to Console</a></div>
</div>

<!-- Admin key bar (hidden until gate is passed) -->
<div class="admin-key-bar" id="key-bar" style="display:none;">
  <span>ADMIN KEY</span>
  <input type="password" class="admin-key-input" id="admin-key-input" placeholder="Enter admin key..." autocomplete="off">
  <button class="admin-key-btn" onclick="setAdminKey()">Set</button>
  <span class="admin-key-status unset" id="admin-key-status">not set</span>
</div>

<!-- Login gate -->
<div class="login-gate" id="login-gate">
  <h2>Admin Access</h2>
  <p>Enter your CIVITAE admin key to access the review queue.</p>
  <div class="admin-key-bar" style="position:static;border:1px solid var(--border);border-radius:6px;padding:16px 20px;background:var(--surface);">
    <span>ADMIN KEY</span>
    <input type="password" class="admin-key-input" id="admin-key-input-gate" placeholder="Enter admin key..." autocomplete="off">
    <button class="admin-key-btn" onclick="setAdminKeyGate()">Enter</button>
  </div>
</div>

<!-- Content (hidden until authenticated) -->
<div class="content" id="content" style="display:none;">
  <div class="section-header">Kassa Post Reviews <span class="section-count" id="kassa-count"></span></div>
  <div id="reviews-list"></div>

  <div class="section-header">Lobby Join Requests <span class="section-count" id="lobby-count"></span></div>
  <div id="lobby-requests-list"></div>

  <div class="section-header">Agent Signups <span class="section-count" id="agent-count"></span></div>
  <div id="agent-signups-list"></div>
</div>

<script>
var API = window.location.origin;
var adminKey = '';

// ── Auth ───────────────────────────────────────────────────────────
function setAdminKeyGate() {
  var input = document.getElementById('admin-key-input-gate');
  adminKey = (input.value || '').trim();
  if (!adminKey) return;
  // Verify key by making a test request
  fetch(API + '/api/operator/reviews?status=pending', {
    headers: { 'X-Admin-Key': adminKey },
  }).then(function (r) {
    if (r.status === 403) {
      alert('Invalid admin key');
      adminKey = '';
      return;
    }
    // Success — show content
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('key-bar').style.display = 'flex';
    document.getElementById('admin-key-input').value = adminKey;
    var status = document.getElementById('admin-key-status');
    status.textContent = 'set';
    status.classList.remove('unset');
    status.classList.add('set');
    loadAll();
  }).catch(function () {
    alert('Backend unreachable');
  });
}

function setAdminKey() {
  var input = document.getElementById('admin-key-input');
  var status = document.getElementById('admin-key-status');
  adminKey = (input.value || '').trim();
  if (adminKey) {
    status.textContent = 'set';
    status.classList.remove('unset');
    status.classList.add('set');
    loadAll();
  } else {
    status.textContent = 'not set';
    status.classList.add('unset');
    status.classList.remove('set');
  }
}

function loadAll() {
  loadReviews();
  loadLobbyRequests();
  loadAgentSignups();
}

// ── Kassa post reviews ─────────────────────────────────────────────
function loadReviews() {
  var list = document.getElementById('reviews-list');
  var countEl = document.getElementById('kassa-count');
  if (!adminKey) { list.innerHTML = ''; return; }
  fetch(API + '/api/operator/reviews?status=pending', {
    headers: { 'X-Admin-Key': adminKey },
  })
    .then(function (r) {
      if (r.status === 403) { list.innerHTML = '<div class="empty-state">Invalid admin key</div>'; return null; }
      return r.json();
    })
    .then(function (reviews) {
      if (reviews === null) return;
      list.innerHTML = '';
      countEl.textContent = reviews.length ? '(' + reviews.length + ')' : '';
      if (!reviews.length) {
        list.innerHTML = '<div class="empty-state">No pending posts</div>';
        return;
      }
      reviews.forEach(function (rv) {
        var post = rv.post || {};
        var card = document.createElement('div');
        card.className = 'review-card';
        var idEl = document.createElement('div');
        idEl.className = 'card-id';
        idEl.textContent = rv.review_id || post.id || '—';
        card.appendChild(idEl);
        var titleEl = document.createElement('div');
        titleEl.className = 'card-title';
        titleEl.textContent = post.title || '—';
        var badge = document.createElement('span');
        badge.className = 'review-badge';
        badge.textContent = post.tab || '—';
        titleEl.appendChild(badge);
        card.appendChild(titleEl);
        var fromEl = document.createElement('div');
        fromEl.className = 'review-from';
        fromEl.textContent = 'From: ' + (rv.from_name || '—') + ' <' + (rv.from_email || '—') + '>';
        card.appendChild(fromEl);
        if (post.body) {
          var bodyEl = document.createElement('div');
          bodyEl.className = 'review-body';
          bodyEl.textContent = post.body.slice(0, 200);
          card.appendChild(bodyEl);
        }
        var actions = document.createElement('div');
        actions.className = 'review-actions';
        var approveBtn = document.createElement('button');
        approveBtn.className = 'review-btn approve';
        approveBtn.textContent = 'Approve';
        approveBtn.onclick = function () { reviewAction(rv.review_id, 'approve', card); };
        actions.appendChild(approveBtn);
        var rejectBtn = document.createElement('button');
        rejectBtn.className = 'review-btn reject';
        rejectBtn.textContent = 'Reject';
        rejectBtn.onclick = function () { reviewAction(rv.review_id, 'reject', card); };
        actions.appendChild(rejectBtn);
        card.appendChild(actions);
        list.appendChild(card);
      });
    })
    .catch(function () { list.innerHTML = '<div class="empty-state">Backend offline</div>'; });
}

function reviewAction(reviewId, action, cardEl) {
  fetch(API + '/api/operator/reviews/' + encodeURIComponent(reviewId) + '?action=' + action, {
    method: 'PATCH',
    headers: { 'X-Admin-Key': adminKey },
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.status === 'approved' || d.status === 'rejected') {
        cardEl.style.opacity = '0.4';
        cardEl.style.pointerEvents = 'none';
        var note = document.createElement('div');
        note.className = 'card-meta';
        note.style.color = action === 'approve' ? 'var(--green)' : 'var(--warn)';
        note.textContent = action === 'approve' ? '✓ Approved — post is now live' : '✗ Rejected';
        cardEl.appendChild(note);
        loadReviews();
      }
    })
    .catch(function () {});
}

// ── Lobby join requests ────────────────────────────────────────────
function loadLobbyRequests() {
  var list = document.getElementById('lobby-requests-list');
  var countEl = document.getElementById('lobby-count');
  if (!adminKey) { list.innerHTML = ''; return; }
  fetch(API + '/api/lobby/requests?status=pending', {
    headers: { 'X-Admin-Key': adminKey },
  })
    .then(function (r) {
      if (r.status === 403) return null;
      return r.json();
    })
    .then(function (requests) {
      if (requests === null) { list.innerHTML = ''; return; }
      list.innerHTML = '';
      countEl.textContent = requests.length ? '(' + requests.length + ')' : '';
      if (!requests.length) {
        list.innerHTML = '<div class="empty-state">No pending join requests</div>';
        return;
      }
      requests.forEach(function (req) {
        var card = document.createElement('div');
        card.className = 'review-card';
        var idEl = document.createElement('div');
        idEl.className = 'card-id';
        idEl.textContent = req.id || '—';
        card.appendChild(idEl);
        var nameEl = document.createElement('div');
        nameEl.className = 'card-title';
        nameEl.textContent = req.name || '—';
        var badge = document.createElement('span');
        badge.className = 'review-badge';
        badge.textContent = req.role || '—';
        nameEl.appendChild(badge);
        card.appendChild(nameEl);
        var fromEl = document.createElement('div');
        fromEl.className = 'review-from';
        fromEl.textContent = req.email || '—';
        card.appendChild(fromEl);
        if (req.message) {
          var bodyEl = document.createElement('div');
          bodyEl.className = 'review-body';
          bodyEl.textContent = req.message.slice(0, 200);
          card.appendChild(bodyEl);
        }
        var actions = document.createElement('div');
        actions.className = 'review-actions';
        var approveBtn = document.createElement('button');
        approveBtn.className = 'review-btn approve';
        approveBtn.textContent = 'Approve';
        approveBtn.onclick = function () { lobbyAction(req.id, 'approve', card); };
        actions.appendChild(approveBtn);
        var rejectBtn = document.createElement('button');
        rejectBtn.className = 'review-btn reject';
        rejectBtn.textContent = 'Reject';
        rejectBtn.onclick = function () { lobbyAction(req.id, 'reject', card); };
        actions.appendChild(rejectBtn);
        card.appendChild(actions);
        list.appendChild(card);
      });
    })
    .catch(function () { list.innerHTML = ''; });
}

function lobbyAction(reqId, action, cardEl) {
  var url = API + '/api/lobby/' + action + '/' + encodeURIComponent(reqId);
  fetch(url, {
    method: 'POST',
    headers: { 'X-Admin-Key': adminKey },
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok || d.user_id) {
        cardEl.style.opacity = '0.4';
        cardEl.style.pointerEvents = 'none';
        var note = document.createElement('div');
        note.className = 'card-meta';
        note.style.color = action === 'approve' ? 'var(--green)' : 'var(--warn)';
        note.textContent = action === 'approve' ? '✓ Approved — user can enter chamber' : '✗ Rejected';
        cardEl.appendChild(note);
        loadLobbyRequests();
      }
    })
    .catch(function () {});
}

// ── Agent signups ──────────────────────────────────────────────────
function loadAgentSignups() {
  var list = document.getElementById('agent-signups-list');
  var countEl = document.getElementById('agent-count');
  if (!adminKey) { list.innerHTML = ''; return; }
  fetch(API + '/api/provision/registry', {
    headers: { 'X-Admin-Key': adminKey },
  })
    .then(function (r) {
      if (r.status === 403) return null;
      return r.json();
    })
    .then(function (data) {
      if (data === null) { list.innerHTML = ''; return; }
      list.innerHTML = '';
      var pending = (data.registry || []).filter(function (a) { return a.status === 'pending'; });
      countEl.textContent = pending.length ? '(' + pending.length + ')' : '';
      if (!pending.length) {
        list.innerHTML = '<div class="empty-state">No pending agent signups</div>';
        return;
      }
      pending.forEach(function (agent) {
        var card = document.createElement('div');
        card.className = 'review-card';
        var idEl = document.createElement('div');
        idEl.className = 'card-id';
        idEl.textContent = agent.agent_id || '—';
        card.appendChild(idEl);
        var nameEl = document.createElement('div');
        nameEl.className = 'card-title';
        nameEl.textContent = agent.name || '—';
        var badge = document.createElement('span');
        badge.className = 'review-badge';
        badge.textContent = agent.role || '—';
        nameEl.appendChild(badge);
        card.appendChild(nameEl);
        var fromEl = document.createElement('div');
        fromEl.className = 'review-from';
        fromEl.textContent = agent.email || '—';
        card.appendChild(fromEl);
        if (agent.capabilities && agent.capabilities.length) {
          var bodyEl = document.createElement('div');
          bodyEl.className = 'review-body';
          bodyEl.textContent = 'Capabilities: ' + agent.capabilities.join(', ');
          card.appendChild(bodyEl);
        }
        var actions = document.createElement('div');
        actions.className = 'review-actions';
        var approveBtn = document.createElement('button');
        approveBtn.className = 'review-btn approve';
        approveBtn.textContent = 'Approve';
        approveBtn.onclick = function () { agentAction(agent.agent_id, 'approve', card); };
        actions.appendChild(approveBtn);
        var rejectBtn = document.createElement('button');
        rejectBtn.className = 'review-btn reject';
        rejectBtn.textContent = 'Reject';
        rejectBtn.onclick = function () { agentAction(agent.agent_id, 'reject', card); };
        actions.appendChild(rejectBtn);
        card.appendChild(actions);
        list.appendChild(card);
      });
    })
    .catch(function () { list.innerHTML = ''; });
}

function agentAction(agentId, action, cardEl) {
  var url = API + '/api/provision/' + action;
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
    body: JSON.stringify({ agent_id: agentId }),
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.approved || d.rejected) {
        cardEl.style.opacity = '0.4';
        cardEl.style.pointerEvents = 'none';
        var note = document.createElement('div');
        note.className = 'card-meta';
        note.style.color = action === 'approve' ? 'var(--green)' : 'var(--warn)';
        note.textContent = action === 'approve' ? '✓ Approved — agent is now active' : '✗ Rejected';
        cardEl.appendChild(note);
        loadAgentSignups();
      }
    })
    .catch(function () {});
}

// Enter key triggers login
document.getElementById('admin-key-input-gate').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') setAdminKeyGate();
});
</script>
</body>
</html>
