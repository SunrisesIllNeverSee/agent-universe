[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thread-journey-parser"
version = "0.3.0"
description = "Historical conversation parser with canonical CSV, tree topology, authority evolution, continuation, documents, and third-party review contracts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ello Cello LLC" }]
dependencies = []

[project.scripts]
thread-journey-parser = "thread_journey_parser.cli:main"

[tool.setuptools]
packages = ["thread_journey_parser"]
package-dir = { thread_journey_parser = "." }
