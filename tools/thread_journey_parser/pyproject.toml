[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thread-parser"
version = "0.4.0"
description = "Historical conversation parser with canonical CSV, preserved tree topology, authority evolution, search, organization, and independent review contracts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ello Cello LLC" }]
dependencies = []

[project.scripts]
thread-parser = "thread_parser.cli:main"
thread-parser-archive = "thread_parser.archive_cli:main"

[tool.setuptools]
packages = ["thread_parser"]
package-dir = { thread_parser = "." }
