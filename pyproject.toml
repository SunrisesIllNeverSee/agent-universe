[project]
name = "agent-universe-mcp"
version = "0.2.0"
description = "Signomy / CIVITAE governed agent marketplace — MCP server surface (MIT licensed). Core platform is All Rights Reserved."
readme = "README.md"
license = { file = "LICENSE-MCP" }
requires-python = ">=3.10"
authors = [
    { name = "Ello Cello LLC" },
]
keywords = ["mcp", "ai-agents", "marketplace", "governance", "civitae", "signomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "civitae-mcp>=0.2.0",
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
civitae-mcp = "civitae_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
