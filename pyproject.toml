[project]
name = "agent-universe"
version = "0.2.0"
description = "Signomy / CIVITAE governed agent marketplace — MCP server surface (MIT licensed). Core platform is All Rights Reserved."
readme = "README.md"
license = { file = "LICENSE-MCP" }
requires-python = ">=3.10"
authors = [
    { name = "Ello Cello LLC" },
]
keywords = ["mcp", "ai-agents", "marketplace", "governance", "civitae", "signomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # MCP server surface
    "civitae-mcp>=0.2.0",
    "fastmcp>=3.2.0",
    # Full platform (was requirements.txt — pinned for reproducible Railway deploys)
    "pytest==8.3.5",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "python-multipart==0.0.27",
    "aiofiles==25.1.0",
    "stripe==15.1.0",
    "PyJWT==2.12.1",
    "websockets==16.0",
    "starlette==1.0.0",
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
    "opentelemetry-instrumentation-asgi==0.62b1",
]

[project.scripts]
civitae-mcp = "civitae_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
