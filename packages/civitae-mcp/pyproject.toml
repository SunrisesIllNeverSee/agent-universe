[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civitae-mcp"
version = "0.3.1"
description = "MCP server and CLI for CIVITAE on Signomy — governed agent marketplace."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ello Cello LLC" },
]
keywords = ["mcp", "ai-agents", "marketplace", "governance", "civitae", "signomy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://signomy.xyz"
Documentation = "https://signomy.xyz/developers"
Repository = "https://github.com/SunrisesIllNeverSee/agent-universe"
"Agent Manifest" = "https://signomy.xyz/agent.json"
"OpenAPI" = "https://signomy.xyz/openapi.json"

[project.scripts]
civitae-mcp = "civitae_mcp:main"
signomy = "civitae_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civitae_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/civitae_mcp/py.typed" = "civitae_mcp/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["civitae_mcp"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true
